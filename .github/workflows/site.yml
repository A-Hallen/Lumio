name: Sitio de descarga

on:
  push:
    branches: [main]
    paths: ['site/**', 'schedule/**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Armar carpeta del sitio
        run: |
          mkdir -p dist/schedule
          cp -r site/. dist/
          cp schedule/*.json dist/schedule/

      - name: Desplegar en Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lumio --branch=main

      - name: Aviso si falta Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Sin CLOUDFLARE_API_TOKEN el sitio no se despliega desde Actions."
